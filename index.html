  <!-- ===== Fonts (self-hosted Google Fonts, latin subset, SIL OFL) ===== -->

  <!-- Full-screen hero photo: fetch it early (browsers without AVIF skip this hint) -->
  <link rel="preload" as="image" type="image/avif" imagesrcset="/assets/img/hero-bg-720.avif 720w, /assets/img/hero-bg-1086.avif 1086w" imagesizes="100vw" fetchpriority="high">

  <!-- Before first paint: saved theme (so there is no flash of the wrong
       theme), JS flag, entry-screen decision.
       motion-pending keeps animated elements in their server-rendered start
       state until React takes over. If the app has not started within 5 s
       the classes are removed, so the pre-rendered content stays visible. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
      } catch (e) {}
      d.classList.add('motion-pending');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // Entry screen ("View Portfolio" → boot sequence) on every visit,
      // except deep links straight to a section and reduced motion
      if (!reduce && !location.hash) d.classList.add('show-preloader');
      setTimeout(function () {
        if (!window.__siteReady) {
          window.__failsafe = true;
          d.classList.remove('motion-pending', 'show-preloader');
        }
      }, 5000);
    })();
  </script>
